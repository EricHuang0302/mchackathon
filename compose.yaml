services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: first_aid
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d first_aid"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data
    restart: unless-stopped

  api:
    build: ./agent
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/first_aid
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LOCAL_INVITE_KEY: ${LOCAL_INVITE_KEY:?Set LOCAL_INVITE_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    # The user-managed host Nginx proxies to 127.0.0.1:API_PORT.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    networks:
      - data
      - egress
    restart: unless-stopped

networks:
  data:
    internal: true
  egress: {}

volumes:
  postgres_data:
