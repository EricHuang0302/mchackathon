services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: first_aid
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d first_aid"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./agent
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/first_aid
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LOCAL_INVITE_KEY: ${LOCAL_INVITE_KEY:?Set LOCAL_INVITE_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
