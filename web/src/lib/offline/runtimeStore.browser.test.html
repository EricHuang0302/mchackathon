<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RuntimeStore browser test</title>
  </head>
  <body data-result="running">
    RUNNING
    <script src="./runtimeStore.browser.test.generated.js"></script>
    <script type="module">
      const registration = await navigator.serviceWorker.register(
        "./runtimeServiceWorker.js",
        { scope: "./" },
      );
      await navigator.serviceWorker.ready;
      registration.active?.postMessage({
        type: "cache.approved",
        assets: [
          "./runtimeStore.browser.test.html",
          "./runtimeStore.browser.test.generated.js",
        ],
      });
      document.body.dataset.serviceWorker = "ready";
      document.body.append(" | SW READY");
    </script>
  </body>
</html>
