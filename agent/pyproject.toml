[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "first-aid-copilot-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "pydantic>=2.10,<3",
  "flask-sock>=0.7,<1",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=44,<48",
  "gunicorn>=23,<25",
  "jsonschema>=4.21,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "openapi-spec-validator>=0.7,<1"]
live = ["google-adk>=1.0,<2", "google-genai>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.services.postgres_data" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
